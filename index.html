<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Admission Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
    padding:30px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h1,h2{
    text-align:center;
    margin-bottom:20px;
}

form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

input,
select,
textarea{
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

textarea{
    resize:none;
    height:100px;
}

.radio-group,
.checkbox-group{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
}

.upload-btn,
.submit-btn{
    background:royalblue;
    color:white;
    border:none;
    padding:12px;
    border-radius:5px;
    cursor:pointer;
}

.upload-btn:hover,
.submit-btn:hover{
    background:#2458d3;
}

small{
    color:red;
}

.students-heading{
    margin-top:30px;
}

#studentContainer{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:20px;
    margin-top:20px;
}

.student-card{
    background:white;
    border-radius:10px;
    padding:15px;
    box-shadow:0 0 8px rgba(0,0,0,.15);
}

.student-photo{
    width:100%;
    height:200px;
    object-fit:cover;
    border-radius:8px;
    margin-bottom:10px;
}

.student-card p{
    margin:6px 0;
}

.skills{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:10px 0;
}

.skill{
    background:royalblue;
    color:white;
    padding:5px 10px;
    border-radius:20px;
    font-size:14px;
}

.deleteBtn{
    width:100%;
    background:crimson;
    color:white;
    border:none;
    padding:10px;
    border-radius:5px;
    cursor:pointer;
}

.deleteBtn:hover{
    background:#b3002d;
}
</style>
</head>
<body>

<div class="container">

<h1>Student Admission Form</h1>

<form id="admissionForm">

<div class="form-group">
<label>Full Name</label>
<input type="text" id="name" placeholder="Enter your name">
</div>

<div class="form-group">
<label>Email</label>
<input type="email" id="email" placeholder="Enter email">
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="password" placeholder="Enter password">
</div>

<div class="form-group">
<label>Age</label>
<input type="number" id="age">
</div>

<div class="form-group">
<label>Date of Birth</label>
<input type="date" id="dob">
</div>

<div class="form-group">
<label>Interview Time</label>
<input type="time" id="time">
</div>

<div class="form-group">
<label>Gender</label>

<div class="radio-group">
<label><input type="radio" name="gender" value="Male"> Male</label>

<label><input type="radio" name="gender" value="Female"> Female</label>

<label><input type="radio" name="gender" value="Other"> Other</label>
</div>
</div>

<div class="form-group">
<label>Course</label>

<select id="course">
<option value="">Select Course</option>
<option value="B.Tech CSE">B.Tech CSE</option>
<option value="BCA">BCA</option>
<option value="MCA">MCA</option>
<option value="BBA">BBA</option>
</select>
</div>

<div class="form-group">
<label>Address</label>
<textarea id="address"></textarea>
</div>

<div class="form-group">

<label>Upload Photo</label>

<input
type="file"
id="photo"
accept="image/*"
hidden
>

<button
type="button"
id="uploadBtn"
class="upload-btn"
>
Choose Photo
</button>

<p id="fileName">
No file selected
</p>

</div>

<div class="form-group">

<label>Skills</label>

<div class="checkbox-group">

<label>
<input type="checkbox"
name="skills"
value="HTML">
HTML
</label>

<label>
<input type="checkbox"
name="skills"
value="CSS">
CSS
</label>

<label>
<input type="checkbox"
name="skills"
value="JavaScript">
JavaScript
</label>

<label>
<input type="checkbox"
name="skills"
value="React">
React
</label>

</div>

</div>

<label>
<input type="checkbox" id="terms">
I accept Terms & Conditions
</label>

<button
type="submit"
class="submit-btn"
>
Submit Application
</button>

</form>

<h2 class="students-heading">
Submitted Applications
</h2>

<div id="studentContainer"></div>

</div>

<script>

const nameRegex = /^[A-Za-z ]{3,40}$/;

const emailRegex =
/^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[A-Za-z]{2,}$/;

const passwordRegex =
/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;

const nameInput = document.querySelector("#name");
const emailInput = document.querySelector("#email");
const passwordInput = document.querySelector("#password");
const ageInput = document.querySelector("#age");
const dobInput = document.querySelector("#dob");
const timeInput = document.querySelector("#time");
const courseInput = document.querySelector("#course");
const addressInput = document.querySelector("#address");
const photoInput = document.querySelector("#photo");
const uploadBtn = document.querySelector("#uploadBtn");
const fileName = document.querySelector("#fileName");
const termsInput = document.querySelector("#terms");

const form =
document.querySelector("#admissionForm");

const studentContainer =
document.querySelector("#studentContainer");

uploadBtn.addEventListener("click",function(){
    photoInput.click();
});

photoInput.addEventListener("change",function(){

    if(photoInput.files.length>0){
        fileName.textContent =
        photoInput.files[0].name;
    }
    else{
        fileName.textContent =
        "No file selected";
    }

});

form.addEventListener("submit",function(e){

    e.preventDefault();

    const name = nameInput.value.trim();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const age = ageInput.value;
    const dob = dobInput.value;
    const time = timeInput.value;
    const course = courseInput.value;
    const address = addressInput.value;

    if(!nameRegex.test(name)){
        alert("Enter Valid Name");
        return;
    }

    if(!emailRegex.test(email)){
        alert("Enter Valid Email");
        return;
    }

    if(!passwordRegex.test(password)){
        alert(
        "Password must contain Uppercase, Lowercase, Number and Special Character"
        );
        return;
    }

    const genderInput =
    document.querySelector(
    'input[name="gender"]:checked'
    );

    if(!genderInput){
        alert("Select Gender");
        return;
    }

    const gender = genderInput.value;

    const allSkills =
    document.querySelectorAll(
    'input[name="skills"]:checked'
    );

    let skills = [];

    allSkills.forEach(function(ele){
        skills.push(ele.value);
    });

    if(skills.length===0){
        alert("Select at least one skill");
        return;
    }

    if(!termsInput.checked){
        alert("Accept Terms & Conditions");
        return;
    }

    if(photoInput.files.length===0){
        alert("Upload Photo");
        return;
    }

    const imageURL =
    URL.createObjectURL(photoInput.files[0]);

    const card =
    document.createElement("div");

    card.classList.add("student-card");

    card.innerHTML = `
        <img
        src="${imageURL}"
        class="student-photo"
        alt="${name}"
        >

        <h3>${name}</h3>

        <p><strong>Email:</strong> ${email}</p>
        <p><strong>Age:</strong> ${age}</p>
        <p><strong>DOB:</strong> ${dob}</p>
        <p><strong>Interview:</strong> ${time}</p>
        <p><strong>Gender:</strong> ${gender}</p>
        <p><strong>Course:</strong> ${course}</p>
        <p><strong>Address:</strong> ${address}</p>

        <p><strong>Skills:</strong></p>

        <div class="skills">
            ${skills.map(skill =>
            `<span class="skill">${skill}</span>`
            ).join("")}
        </div>

        <button class="deleteBtn">
        Delete
        </button>
    `;

    card
    .querySelector(".deleteBtn")
    .addEventListener("click",function(){
        card.remove();
    });

    studentContainer.appendChild(card);

    form.reset();

    fileName.textContent =
    "No file selected";

});
